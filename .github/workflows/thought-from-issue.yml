name: Publish thought from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'thought')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Convert issue to thought post
        run: node .github/scripts/publish-thought.mjs
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}

      - name: Commit post to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/_posts source/img
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "thought: publish from issue #${{ github.event.issue.number }}"
            git push origin HEAD:main
          fi

      - name: Build
        run: npx hexo clean && npx hexo generate

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

      - name: Close issue
        continue-on-error: true
        run: gh issue close ${{ github.event.issue.number }} --comment "已发布 ✅ 访问 https://Sojay0205.github.io/notes/ 查看。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
