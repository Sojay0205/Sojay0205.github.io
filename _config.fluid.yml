# Fluid theme config
color_scheme: auto

navbar:
  blog_title: "Sojay"
  blog_title_url: "/"
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tag" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }
    - { key: "notes", link: "/notes/", icon: "iconfont icon-edit" }
    - { key: "messages", link: "/messages/", icon: "iconfont icon-comment" }
  search:
    enable: true
    path: /local-search.xml
    field: post
    content: true

index:
  banner_img: "/img/banner.jpg"
  banner_img_height: 60
  banner_mask_alpha: 0.3
  slogan:
    enable: true
    text:
      - "记录生活，分享技术"
      - "Stay hungry, stay foolish"
  auto_excerpt:
    enable: true
    length: 120

post:
  banner_img: "/img/banner.jpg"
  banner_img_height: 30
  banner_mask_alpha: 0.3
  meta:
    author:
      enable: true
    date:
      enable: true
      format: "LL"
    wordcount:
      enable: true
      format: "{} 字"
    min2read:
      enable: true
      format: "{} 分钟"
    views:
      enable: false
  toc:
    enable: true
    headingSelector: h1,h2,h3
    collapseDepth: 0
  copyright:
    enable: true
    default: CC BY-NC-SA 4.0
  comments:
    enable: true
    type: supabase-messageboard

archive:
  banner_img: "/img/banner.jpg"
  banner_img_height: 30
  banner_mask_alpha: 0.3

category:
  banner_img: "/img/banner.jpg"
  banner_img_height: 30
  banner_mask_alpha: 0.3

tag:
  banner_img: "/img/banner.jpg"
  banner_img_height: 30
  banner_mask_alpha: 0.3
  tagcloud:
    min_font: 15
    max_font: 25
    unit: px
    start_color: "#BBBBEE"
    end_color: "#337ab7"

about:
  banner_img: "/img/banner.jpg"
  banner_img_height: 30
  banner_mask_alpha: 0.3
  avatar: ""
  name: "Sojay"
  intro: "记录生活，分享学习，搭建技术栈"

page404:
  enable: true
  banner_img: "/img/banner.jpg"
  banner_img_height: 30
  banner_mask_alpha: 0.3

footer:
  content: '由 <a href="https://hexo.io" target="_blank">Hexo</a> 驱动，主题 <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank">Fluid</a>'
  statistics:
    enable: false
  beian:
    enable: false

highlight:
  enable: true
  lib: highlightjs
  highlightjs:
    style: github
    bg_color: false

lazyload:
  enable: true
  onlypost: false

# 图标字体（添加 https 前缀避免协议问题）
iconfont: https://at.alicdn.com/t/c/font_1736178_k526ubmyhba.css

search:
  path: /local-search.xml
  field: post
  content: true



