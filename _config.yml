# ===================================================
# Hexo 主配置文件 _config.yml
# 用户：Sojya0205
# 主题：Fluid（简约风格）
# ===================================================

# ----- 站点基本信息 -----
title: Sojay's Blog        # 博客名称，可改成你喜欢的名字
subtitle: '记录生活，分享技术'   # 副标题
description: "Sojay 的个人博客——记录生活、技术、AI 编程与思考，分享成长路上的所学所得"
keywords: 博客,技术,AI,编程,生活,随笔,Claude Code,个人成长
author: Sojay               # 作者名
language: zh-CN                 # 语言：中文
timezone: 'Asia/Shanghai'       # 时区

# ----- 网址设置 -----
url: https://Sojay0205.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ----- 目录结构（保持默认即可）-----
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ----- 文章写作设置 -----
new_post_name: :title.md        # 新文章文件名格式
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prism_plugin:
  mode: 'preprocess'
  theme: 'default'
  line_number: false
  custom_css:

# ----- 主页分页 -----
index_generator:
  path: ''
  per_page: 10                  # 每页显示文章数
  order_by: -date

# ----- 分类 & 标签 -----
default_category: uncategorized
category_map:
tag_map:

# ----- 元数据 -----
meta_generator: true

# ----- 日期格式 -----
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# ----- 分页 -----
per_page: 10
pagination_dir: page

# ----- 碎碎念（Thoughts）模块 -----
thoughts:
  per_page: 20   # 每页条数（无限滚动每批加载量）
  order: -1      # -1 倒序
  publish_url: "https://github.com/Sojay0205/Sojay0205.github.io/issues/new?labels=thought&title=%E7%A2%8E%E7%A2%8E%E5%BF%B5&body=%3C!--%20%E5%9C%A8%E8%BF%99%E9%87%8C%E5%86%99%E7%A2%8E%E7%A2%8E%E5%BF%B5%E5%86%85%E5%AE%B9%EF%BC%8C%E6%94%AF%E6%8C%81%20Markdown%E3%80%81%E6%8D%A2%E8%A1%8C%E3%80%81%E9%93%BE%E6%8E%A5%EF%BC%9B%E5%9B%BE%E7%89%87%E7%9B%B4%E6%8E%A5%E7%B2%98%E8%B4%B4%E6%88%96%E6%8B%96%E5%85%A5%E5%8D%B3%E5%8F%AF%20--%3E"

# ----- 包含 / 排除文件 -----
include:
exclude:
ignore:

# ----- 资源压缩(hexo-all-minifier)-----
# 该插件 0.5.7 在 Node 20+ 下会把文章 HTML 压缩成 0 字节空文件,导致文章打不开,故禁用
all_minifier: false

# ----- 主题设置 -----
theme: fluid
theme_config:                    # 使用 Fluid 主题

# ----- 部署设置（GitHub Actions 自动部署，这里留空）-----
deploy:
  type: ''
