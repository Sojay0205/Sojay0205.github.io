><a class="back-link" href="/notes/">返回碎碎念</a></header><section class="auth-card"><div class="auth-row"><input id="emailInput" type="email" placeholder="输入管理员邮箱登录"> <button type="button" id="loginBtn">发送登录链接</button></div><p id="statusText" class="status-text">等待操作</p></section><section class="section-card"><div class="section-title-row"><h2>碎碎念管理</h2><span>notes</span></div><div id="notesList" class="timeline"></div></section><section class="section-card"><div class="section-title-row"><h2>留言板管理</h2><span>messages</span></div><div id="messagesList" class="timeline"></div></section></div></div><style>.manage-page{max-width:980px;margin:0 auto;padding:1.5rem 1rem 3rem}.manage-shell{max-width:860px;margin:0 auto}.manage-header{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.4rem}.manage-header h1{font-size:2.1rem;line-height:1.1;margin:0 0 .5rem}.manage-header p{margin:0;color:var(--text-color-3,#8a8a8a);font-size:1rem}.back-link{display:inline-flex;align-items:center;justify-content:center;padding:.55rem .95rem;border-radius:999px;border:1px solid rgba(127,127,127,.18);background:rgba(255,255,255,.05);white-space:nowrap}.auth-card,.item-card,.section-card{background:var(--card-bg-color,#111);border:1px solid rgba(127,127,127,.14);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.04)}.auth-card{padding:1rem 1rem 1.1rem;margin-bottom:1rem}.auth-row{display:flex;gap:.75rem;align-items:center}.auth-row input{flex:1;min-width:0;border:1px solid rgba(127,127,127,.18);border-radius:999px;padding:.7rem 1rem;background:0 0;color:inherit;outline:0}.auth-row input:focus{border-color:var(--btn-bg-color,#1e80ff)}#loginBtn,.delete-btn{border:0;border-radius:999px;padding:.6rem 1rem;cursor:pointer;background:var(--btn-bg-color,#1e80ff);color:#fff;font-weight:600}.status-text{margin:.75rem 0 0;color:var(--text-color-3,#8a8a8a);font-size:.9rem}.section-card{padding:1rem;margin-top:1rem}.section-title-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.9rem}.section-title-row h2{margin:0;font-size:1.3rem}.section-title-row span{color:var(--text-color-3,#8a8a8a);font-size:.9rem}.timeline{position:relative;padding-left:1.8rem}.timeline::before{content:"";position:absolute;left:.52rem;top:0;bottom:0;width:1px;background:rgba(127,127,127,.18)}.item{position:relative;margin-bottom:1rem;padding-left:.8rem}.item::before{content:"";position:absolute;left:-.16rem;top:1rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--accent-color,#f1b34d);box-shadow:0 0 0 5px rgba(241,179,77,.12)}.item-card{padding:1rem 1.05rem}.item-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.65rem;color:var(--text-color-3,#8a8a8a);font-size:.9rem}.item-meta{display:flex;flex-wrap:wrap;gap:.5rem;font-size:.85rem;color:var(--text-color-3,#8a8a8a)}.item-body{display:grid;gap:.85rem}.item-image{width:100%;max-height:420px;object-fit:cover;border-radius:14px;border:1px solid rgba(127,127,127,.12);background:rgba(0,0,0,.08)}.item-text{white-space:pre-wrap;word-break:break-word;line-height:1.9;font-size:1rem}.item-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.8rem;flex-wrap:wrap}.delete-btn{background:rgba(255,82,82,.1);color:#ff5f5f}.empty{padding:2rem 1rem;text-align:center;color:var(--text-color-3,#8a8a8a)}@media (max-width:640px){.manage-page{padding:1rem .8rem 2rem}.manage-header{align-items:flex-start;flex-direction:column}.auth-card,.item-card,.section-card{border-radius:16px}.auth-row{flex-direction:column;align-items:stretch}#loginBtn,.back-link{width:100%}.timeline{padding-left:1.35rem}}</style><script type="module">import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL = 'https://eqkcyfkhnihdchmcfdcw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4Y_S9gtbbOoa99cPZsKEbg_gaIw1GPW';
const ADMIN_EMAIL = '1557754391@qq.com';
const COMMENTS_TABLE = 'comments';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const emailInput = document.getElementById('emailInput');
const loginBtn = document.getElementById('loginBtn');
const statusText = document.getElementById('statusText');
const notesList = document.getElementById('notesList');
const messagesList = document.getElementById('messagesList');
const setStatus = (text) => { statusText.textContent = text; };
const getSession = async () => { const { data } = await supabase.auth.getSession(); return data.session || null; };
const isAdmin = (session) => Boolean(session?.user?.email && session.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
const formatTime = (value) => new Date(value).toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
const escapeText = (value) => (value || '').trim();
const resolveImageUrl = async (value) => {
  if (!value) return '';
  if (/^(https?:|data:)/i.test(value)) return value;
  if (value.startsWith('storage:')) {
    const storagePath = value.slice('storage:'.length);
    const { data, error } = await supabase.storage.from('thoughts-images').createSignedUrl(storagePath, 60 * 60 * 24 * 7);
    if (!error && data?.signedUrl) return data.signedUrl;
  }
  return value;
};
const renderNotes = async () => {
  const { data, error } = await supabase.from(COMMENTS_TABLE).select('id, content, website, created_at').eq('scope', 'notes').in('thread_key', ['notes', '/notes']).is('parent_id', null).order('created_at', { ascending: false });
  if (error) { notesList.innerHTML = `<div class="empty">加载失败：${error.message}</div>`; return; }
  if (!data.length) { notesList.innerHTML = '<div class="empty">还没有碎碎念。</div>'; return; }
  const resolved = await Promise.all(data.map(async (item) => ({ ...item, imageSrc: await resolveImageUrl(item.website) })));
  notesList.innerHTML = resolved.map((item) => `<article class="item" data-id="${item.id}"><div class="item-card"><div class="item-head"><time>${formatTime(item.created_at)}</time><span>碎碎念</span></div><div class="item-body">${item.imageSrc ? `<img class="item-image" src="${item.imageSrc}" srcset="/img/loading.gif" lazyload alt="碎碎念图片">` : ''}<div class="item-text"></div></div><div class="item-actions"><button class="delete-btn" type="button" data-delete-note="${item.id}">删除</button></div></div></article>`).join('');
  notesList.querySelectorAll('.item').forEach((card) => { const item = resolved.find((entry) => entry.id === card.dataset.id); card.querySelector('.item-text').textContent = item.content; });
};
const renderMessages = async () => {
  const { data, error } = await supabase.from(COMMENTS_TABLE).select('id, name, content, created_at').eq('scope', 'board').is('parent_id', null).order('created_at', { ascending: false });
  if (error) { messagesList.innerHTML = `<div class="empty">加载失败：${error.message}</div>`; return; }
  if (!data.length) { messagesList.innerHTML = '<div class="empty">还没有留言。</div>'; return; }
  messagesList.innerHTML = data.map((item) => `<article class="item" data-id="${item.id}"><div class="item-card"><div class="item-head"><time>${formatTime(item.created_at)}</time><span>${escapeText(item.name) || '匿名'}</span></div><div class="item-text"></div><div class="item-actions"><button class="delete-btn" type="button" data-delete-message="${item.id}">删除</button></div></div></article>`).join('');
  messagesList.querySelectorAll('.item').forEach((card) => { const item = data.find((entry) => entry.id === card.dataset.id); card.querySelector('.item-text').textContent = item.content; });
};
const renderAll = async () => { await renderNotes(); await renderMessages(); };
const login = async () => {
  const email = emailInput.value.trim();
  if (!email) { setStatus('请输入邮箱。'); return; }
  loginBtn.disabled = true;
  setStatus('正在发送登录链接…');
  const redirectTo = `${window.location.origin}/notes/manage/`;
  const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo } });
  if (error) setStatus(`发送失败：${error.message}`); else setStatus('已发送登录链接，请查看邮箱。');
  loginBtn.disabled = false;
};
const removeNote = async (id) => { const session = await getSession(); if (!isAdmin(session)) { setStatus('只有管理员邮箱登录后才能删除。'); return; } if (!window.confirm('确定删除这条碎碎念吗？')) return; const { error } = await supabase.from(COMMENTS_TABLE).delete().eq('id', id); if (error) setStatus(`删除失败：${error.message}`); else { setStatus('已删除碎碎念'); await renderAll(); } };
const removeMessage = async (id) => { const session = await getSession(); if (!isAdmin(session)) { setStatus('只有管理员邮箱登录后才能删除。'); return; } if (!window.confirm('确定删除这条留言吗？')) return; const { error } = await supabase.from(COMMENTS_TABLE).delete().eq('id', id); if (error) setStatus(`删除失败：${error.message}`); else { setStatus('已删除留言'); await renderAll(); } };
notesList.addEventListener('click', (event) => { const target = event.target.closest('[data-delete-note]'); if (!target) return; removeNote(target.dataset.deleteNote); });
messagesList.addEventListener('click', (event) => { const target = event.target.closest('[data-delete-message]'); if (!target) return; removeMessage(target.dataset.deleteMessage); });
loginBtn.addEventListener('click', login);
setStatus('等待登录');
renderAll();</script>﻿</article></div></div></div></div></div><a id="scroll-top-button" aria-label="TOP" href="#" role="button"><i class="iconfont icon-arrowup" aria-hidden="true"></i></a><div class="modal fade" id="modalSearch" tabindex="-1" role="dialog" aria-labelledby="ModalLabel" aria-hidden="true"><div class="modal-dialog modal-dialog-scrollable modal-lg" role="document"><div class="modal-content"><div class="modal-header text-center"><h4 class="modal-title w-100 font-weight-bold">搜索</h4><button type="button" id="local-search-close" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button></div><div class="modal-body mx-3"><div class="md-form mb-5"><input type="text" id="local-search-input" class="form-control validate"> <label data-error="x" data-success="v" for="local-search-input">关键词</label></div><div class="list-group" id="local-search-result"></div></div></div></div></div></main><footer><div class="footer-inner"><div class="footer-content">由 <a href="https://hexo.io" target="_blank">Hexo</a> 驱动，主题 <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank">Fluid</a></div></div></footer><script src="https://lib.baomitu.com/nprogress/0.2.0/nprogress.min.js"></script><link rel="stylesheet" href="https://lib.baomitu.com/nprogress/0.2.0/nprogress.min.css"><script>NProgress.configure({showSpinner:!1,trickleSpeed:100}),NProgress.start(),window.addEventListener("load",(function(){NProgress.done()}))</script><script src="https://lib.baomitu.com/jquery/3.6.4/jquery.min.js"></script><script src="https://lib.baomitu.com/twitter-bootstrap/4.6.1/js/bootstrap.min.js"></script><script src="/js/events.js"></script><script src="/js/plugins.js"></script><script src="https://lib.baomitu.com/typed.js/2.0.12/typed.min.js"></script><script>!function(t,e){var i=Fluid.plugins.typing,n=e.getElementById("subtitle");n&&i&&i(n.getAttribute("data-typed-text"))}(window,document)</script><script src="/js/img-lazyload.js"></script
