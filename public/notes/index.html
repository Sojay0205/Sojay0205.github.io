<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://eqkcyfkhnihdchmcfdcw.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_4Y_S9gtbbOoa99cPZsKEbg_gaIw1GPW';
  const OWNER_EMAIL = '1557754391@qq.com';
  const TABLE_NAME = 'notes';
  const BUCKET_NAME = 'thoughts-images';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  });

  const noteInput = document.getElementById('noteInput');
  const publishBtn = document.getElementById('publishBtn');
  const notesList = document.getElementById('notesList');
  const countHint = document.getElementById('countHint');
  const statusText = document.getElementById('statusText');
  const authBox = document.getElementById('authBox');
  const emailInput = document.getElementById('emailInput');
  const loginBtn = document.getElementById('loginBtn');
  const imageInput = document.getElementById('imageInput');
  const imagePreviewWrap = document.getElementById('imagePreviewWrap');
  const imagePreview = document.getElementById('imagePreview');
  const removeImageBtn = document.getElementById('removeImageBtn');
  const uploadHint = document.getElementById('uploadHint');

  let selectedFile = null;

  const formatTime = (value) => new Date(value).toLocaleString('zh-CN', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });

  const getSession = async () => {
    const { data } = await supabase.auth.getSession();
    return data.session || null;
  };

  const isOwnerSession = (session) => Boolean(session?.user?.email && session.user.email.toLowerCase() === OWNER_EMAIL.toLowerCase());

  const setStatus = (message) => {
    statusText.textContent = message;
  };

  const updateCount = () => {
    countHint.textContent = `${noteInput.value.length} / 300`;
  };

  const clearImageSelection = () => {
    selectedFile = null;
    imageInput.value = '';
    imagePreviewWrap.hidden = true;
    imagePreview.removeAttribute('src');
    uploadHint.textContent = '可选，支持常见图片格式';
  };

  imageInput.addEventListener('change', () => {
    const file = imageInput.files?.[0];
    if (!file) {
      clearImageSelection();
      return;
    }

    if (!file.type.startsWith('image/')) {
      setStatus('请选择图片文件。');
      clearImageSelection();
      return;
    }

    selectedFile = file;
    imagePreview.src = URL.createObjectURL(file);
    imagePreviewWrap.hidden = false;
    uploadHint.textContent = file.name;
    setStatus('图片已选中');
  });

  removeImageBtn.addEventListener('click', clearImageSelection);

  const uploadImage = async (file) => {
    const ext = file.name.split('.').pop() || 'jpg';
    const safeName = `${Date.now()}-${Math.random().toString(16).slice(2)}.${ext}`;
    const { error } = await supabase.storage.from(BUCKET_NAME).upload(safeName, file, {
      contentType: file.type,
      upsert: false
    });

    if (error) throw error;

    const { data } = supabase.storage.from(BUCKET_NAME).getPublicUrl(safeName);
    return data.publicUrl;
  };

  const renderNotes = async () => {
    const { data, error } = await supabase
      .from(TABLE_NAME)
      .select('id, content, image_url, created_at, user_email')
      .order('created_at', { ascending: false });

    if (error) {
      notesList.innerHTML = `<div class="note-empty">加载失败：${error.message}</div>`;
      return;
    }

    const session = await getSession();
    const canDelete = isOwnerSession(session);

    if (!data.length) {
      notesList.innerHTML = '<div class="note-empty">还没有碎碎念，先写第一条吧。</div>';
      return;
    }

    notesList.innerHTML = data.map(note => `
      <article class="note-item" data-id="${note.id}">
        <div class="note-card">
          <div class="note-head">
            <time>${formatTime(note.created_at)}</time>
            ${canDelete ? `<button class="note-delete" type="button" data-delete="${note.id}">删除</button>` : ''}
          </div>
          <div class="note-body">
            ${note.image_url ? `<img class="note-image" src="${note.image_url}" srcset="/img/loading.gif" lazyload alt="碎碎念图片">` : ''}
            <div class="note-text"></div>
          </div>
        </div>
      </article>
    `).join('');

    notesList.querySelectorAll('.note-item').forEach((item) => {
      const note = data.find((entry) => entry.id === item.dataset.id);
      item.querySelector('.note-text').textContent = note.content;
    });
  };

  const publish = async () => {
    const content = noteInput.value.trim();
    if (!content && !selectedFile) return;

    publishBtn.disabled = true;
    setStatus('正在发布…');

    try {
      let imageUrl = null;
      if (selectedFile) {
        setStatus('正在上传图片…');
        imageUrl = await uploadImage(selectedFile);
      }

      const { error } = await supabase.from(TABLE_NAME).insert({
        content,
        image_url: imageUrl
      });

      if (error) throw error;

      noteInput.value = '';
      updateCount();
      clearImageSelection();
      await renderNotes();
      setStatus('已发布');
    } catch (error) {
      setStatus(`发布失败：${error.message}`);
    } finally {
      publishBtn.disabled = false;
    }
  };

  const deleteNote = async (id) => {
    const session = await getSession();
    if (!isOwnerSession(session)) {
      setStatus('只有管理员邮箱登录后才能删除。');
      return;
    }

    if (!window.confirm('确定删除这条碎碎念吗？')) return;

    const { error } = await supabase.from(TABLE_NAME).delete().eq('id', id);
    if (error) {
      setStatus(`删除失败：${error.message}`);
      return;
    }

    setStatus('已删除');
    await renderNotes();
  };

  notesList.addEventListener('click', (event) => {
    const target = event.target.closest('[data-delete]');
    if (!target) return;
    deleteNote(target.dataset.delete);
  });

  publishBtn.addEventListener('click', publish);
  noteInput.addEventListener('input', updateCount);
  noteInput.addEventListener('keydown', (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') publish();
  });

  loginBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    if (email.toLowerCase() !== OWNER_EMAIL.toLowerCase()) {
      setStatus('请输入管理员邮箱。');
      return;
    }

    loginBtn.disabled = true;
    setStatus('正在发送登录链接…');
    const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
    if (error) {
      setStatus(`发送失败：${error.message}`);
      loginBtn.disabled = false;
      return;
    }
    setStatus('登录链接已发送，请查收邮箱。');
    loginBtn.disabled = false;
  });

  const init = async () => {
    updateCount();
    authBox.hidden = false;
    const session = await getSession();
    setStatus(session && isOwnerSession(session) ? `当前登录：${session.user.email}` : '公开发布已开启；管理员登录后可删除内容。');
    await renderNotes();

    supabase.auth.onAuthStateChange(async (_event, nextSession) => {
      setStatus(nextSession && isOwnerSession(nextSession) ? `当前登录：${nextSession.user.email}` : '公开发布已开启；管理员登录后可删除内容。');
      await renderNotes();
    });
  };

  init();
</script>
</body>
</html>
