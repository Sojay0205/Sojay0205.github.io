<style>
.messages-page{max-width:980px;margin:0 auto;padding:1.5rem 1rem 3rem}.messages-shell{max-width:860px;margin:0 auto}.messages-header{margin-bottom:1.4rem}.messages-header h1{font-size:2.2rem;line-height:1.1;margin:0 0 .5rem}.messages-header p{margin:0;color:var(--text-color-3,#8a8a8a);font-size:1rem}.composer-card,.message-card{background:var(--card-bg-color,#111);border:1px solid rgba(127,127,127,.14);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.04)}.composer-card{padding:1rem 1rem 1.1rem}.composer-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin-bottom:.85rem}.field,.message-input{border:1px solid rgba(127,127,127,.18);border-radius:14px;background:transparent;color:inherit;outline:none;width:100%}.field{padding:.8rem .85rem}.message-input{min-height:180px;resize:vertical;padding:.95rem .95rem;line-height:1.75}.field:focus,.message-input:focus{border-color:var(--btn-bg-color,#1e80ff)}.composer-footer{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-top:.8rem}#sendBtn,.delete-btn{border:0;border-radius:999px;padding:.6rem 1rem;cursor:pointer;transition:.2s ease}#sendBtn{background:var(--btn-bg-color,#1e80ff);color:#fff;font-weight:600}.status-text{margin:.75rem 0 0;color:var(--text-color-3,#8a8a8a);font-size:.9rem}.list-title{font-size:1.35rem;font-weight:700;margin:1.5rem 0 1rem}.messages-list{display:grid;gap:1rem}.message-card{padding:1rem}.message-top{display:flex;gap:.8rem;align-items:flex-start}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.08);flex:0 0 auto}.message-main{flex:1;min-width:0}.message-meta{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.35rem;font-size:.95rem}.message-name{font-weight:700}.message-time{color:var(--text-color-3,#8a8a8a);font-size:.85rem}.message-text{white-space:pre-wrap;word-break:break-word;line-height:1.85;margin-top:.35rem}.message-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.8rem}.reply-list{display:grid;gap:.7rem;margin-top:.7rem}.reply-item{padding:.75rem .8rem;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(127,127,127,.1)}.reply-meta{display:flex;justify-content:space-between;gap:.75rem;font-size:.82rem;color:var(--text-color-3,#8a8a8a);margin-bottom:.3rem}.note-empty{padding:2rem 1rem;text-align:center;color:var(--text-color-3,#8a8a8a)}@media (max-width:760px){.composer-grid{grid-template-columns:1fr}.composer-footer{flex-direction:column;align-items:stretch}#sendBtn{width:100%}}
</style>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const SUPABASE_URL = 'https://eqkcyfkhnihdchmcfdcw.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_4Y_S9gtbbOoa99cPZsKEbg_gaIw1GPW';
  const ADMIN_EMAIL = '1557754391@qq.com';
  const COMMENTS_TABLE = 'comments';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  const nameInput = document.getElementById('nameInput');
  const emailInput = document.getElementById('emailInput');
  const websiteInput = document.getElementById('websiteInput');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusText = document.getElementById('statusText');
  const countHint = document.getElementById('countHint');
  const messagesList = document.getElementById('messagesList');
  const setStatus = (text) => statusText.textContent = text;
  const count = () => { countHint.textContent = `${messageInput.value.length} / 1200`; };
  const formatTime = (value) => new Date(value).toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  const safeText = (value) => (value || '').trim();
  const getSession = async () => { const { data } = await supabase.auth.getSession(); return data.session || null; };
  const isAdmin = (session) => Boolean(session?.user?.email && session.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
  const avatarFromEmail = (email) => email ? `https://www.gravatar.com/avatar/${encodeURIComponent(email.trim().toLowerCase())}?d=mp&s=96` : 'https://www.gravatar.com/avatar/?d=mp&s=96';
  const render = async () => {
    const { data, error } = await supabase.from(COMMENTS_TABLE).select('id, name, email, content, created_at, replies(id, name, content, created_at)').eq('parent_id', null).order('created_at', { ascending: false });
    if (error) { messagesList.innerHTML = `<div class="note-empty">?????${error.message}</div>`; return; }
    const session = await getSession();
    const admin = isAdmin(session);
    if (!data.length) { messagesList.innerHTML = '<div class="note-empty">?????????????</div>'; return; }
    messagesList.innerHTML = data.map(item => {
      const replies = (item.replies || []).map(reply => `<div class="reply-item"><div class="reply-meta"><span>${reply.name || '??'}</span><time>${formatTime(reply.created_at)}</time></div><div class="reply-text"></div></div>`).join('');
      return `<article class="message-card" data-id="${item.id}"><div class="message-top"><img class="avatar" src="${avatarFromEmail(item.email)}" alt="??" /><div class="message-main"><div class="message-meta"><div class="message-name">${item.name || '??'}</div><div class="message-time">${formatTime(item.created_at)}</div></div><div class="message-text"></div>${replies ? `<div class="reply-list">${replies}</div>` : '<div class="note-empty" style="padding:1rem 0">????</div>'}${admin ? `<div class="message-actions"><button class="delete-btn" type="button" data-delete="${item.id}">??</button></div>` : ''}</div></div></article>`;
    }).join('');
    messagesList.querySelectorAll('.message-card').forEach(card => { const item = data.find(entry => entry.id === card.dataset.id); card.querySelector('.message-text').textContent = item.content; card.querySelectorAll('.reply-item').forEach((node, index) => { node.querySelector('.reply-text').textContent = item.replies[index]?.content || ''; }); });
  };
  const submit = async () => {
    const name = safeText(nameInput.value); const email = safeText(emailInput.value); const website = safeText(websiteInput.value); const content = safeText(messageInput.value);
    if (!name || !content) { setStatus('????????????'); return; }
    sendBtn.disabled = true; setStatus('?????');
    const { error } = await supabase.from(COMMENTS_TABLE).insert({ name, email, website, content, parent_id: null });
    if (error) setStatus(`?????${error.message}`);
    else { nameInput.value=''; emailInput.value=''; websiteInput.value=''; messageInput.value=''; count(); setStatus('???'); await render(); }
    sendBtn.disabled = false;
  };
  const remove = async (id) => { const session = await getSession(); if (!isAdmin(session)) { setStatus('???????????????'); return; } if (!window.confirm('??????????')) return; const { error } = await supabase.from(COMMENTS_TABLE).delete().eq('id', id); if (error) setStatus(`?????${error.message}`); else { setStatus('???'); await render(); } };
  messagesList.addEventListener('click', (event) => { const target = event.target.closest('[data-delete]'); if (!target) return; remove(target.dataset.delete); });
  sendBtn.addEventListener('click', submit); messageInput.addEventListener('input', count); messageInput.addEventListener('keydown', (event) => { if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') submit(); });
  count(); setStatus('????'); render();
</script>
